name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Export Pigeon Run APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Export APK with Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.4.1/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.4.1/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PigeonRun-Android-APK
          path: build/PigeonRun.apk
          if-no-files-found: error
          retention-days: 14
